        <style>
            .outin {
                animation: popoutin 4s ease-out 0.2s 1;
            }


            @keyframes popoutin {
                0% {
                    color: black;
                    transform: scale(0);
                    opacity: 0;
                    text-shadow: 0 0 0 rgba(0, 0, 0, 0);
                }
                25% {
                    color: red;
                    transform: scale(5);
                    opacity: 1;
                    text-shadow: 3px 10px 5px rgba(0, 0, 0, 0.5);
                }
                50% {
                    color: black;
                    transform: scale(3);
                    opacity: 1;
                    text-shadow: 1px 0 0 rgba(0, 0, 0, 0);
                }
                100% {
                    /* animate nothing to add pause at the end of animation */
                    transform: scale(3);
                    opacity: 1;
                    text-shadow: 1px 0 0 rgba(0, 0, 0, 0);
                }
            }


            .disappear {
  left:0;
  right:0;
  margin: auto;
  width:100%;
  text-align: center;
  height:fit-content;
  bottom:0;
  top:0;
  transform: scale(4);
}
.disappear span {
  display: inline-block;
  color:transparent;
  text-shadow: 0px 0px 0px gray;
  animation-duration: 4s;

}
.disappear span:nth-child(1){
  animation-name: disappearleft;
}
.disappear span:nth-child(2){
  animation-name: disappearleft;
  animation-delay: .3s;
}
.disappear span:nth-child(3){
  animation-name: disappearight;
  animation-delay: .6s;
}
.disappear span:nth-child(4){
  animation-name: disappearight;
  animation-delay: .8s;
}

@keyframes disappearleft{
  50% {transform: skew(50deg) translateY(-200%);
      text-shadow: 0px 0px 50px;
        opacity: 0;
  }
}
@keyframes disappearight{
  50% {transform: skew(-50deg) translateY(-200%);
      text-shadow: 0px 0px 50px;
        opacity: 0;
  }
}

        </style>

        function UpdatePreviewBoard(){
            const canvas = document.getElementById("Gameboard2");
            const ctx = canvas.getContext("2d");
            canvas.width = $('#Gameboard2').parent().width() ;
            canvas.height = $('#Gameboard2').parent().width();
            
            gridItemWidth = canvas.width / stateData.width;
            row = canvas.width / stateData.width;

            for(let i = 0; i < (stateData.width * stateData.height); i++){
                
                let y = Math.floor(i / stateData.width) * gridItemWidth;
                let x = Math.floor(i%stateData.width) * gridItemWidth;

                for(let ii = 0; ii < stateData.players.get(sessionId).board.ships2.size; ii++){
                    let shipValid = stateData.players.get(sessionId).board.ships2.get(ii.toString()).id;
                    if (shipValid == (i+1)){
                        //console.log('ShipSquare: ' + shipValid + '/' + (i+1));
                        if (stateData.players.get(sessionId).board.ships2.get(ii.toString()).hit == 'true'){
                            ctx.beginPath();
                            ctx.fillStyle = "red";
                            ctx.fillRect(x,y, gridItemWidth, gridItemWidth);
                            ctx.stroke(); 
                        }
                        let shipType = stateData.players.get(sessionId).board.ships2.get(ii.toString()).idText;
                        let clipX = stateData.players.get(sessionId).board.ships2.get(ii.toString()).x;
                        let clipY = stateData.players.get(sessionId).board.ships2.get(ii.toString()).y;
                        let image = document.getElementById('img' +  shipType);
                        
                        if (shipType == 'LargeShip') {
                            ctx.drawImage(image,
                                           (clipX * (canvas.width / 2)), (clipY * (canvas.height / 3)), (canvas.width / 2), (canvas.height / 3),
                                            x, y, gridItemWidth, gridItemWidth);
                        }
                        if (shipType == 'MedShip') {
                            ctx.drawImage(image,
                                           (clipX * (canvas.width)), (clipY * (canvas.height / 3)), (canvas.width), (canvas.height / 3),
                                            x, y, gridItemWidth, gridItemWidth);
                        }
                        if (shipType == 'SmallShip') {
                            ctx.drawImage(image,
                                           (clipX * (canvas.width / 2)), (clipY * (canvas.height)), (canvas.width / 2), (canvas.height),
                                            x, y, gridItemWidth, gridItemWidth);
                        }
                        if (shipType == 'TinyShip') {
                            ctx.drawImage(image,
                                           (clipX * (canvas.width )), (clipY * (canvas.height )), (canvas.width), (canvas.height),
                                            x, y, gridItemWidth, gridItemWidth);
                        }

                        break;
                    }
                    else{
                        ctx.beginPath();
                        ctx.fillStyle = "green";
                        ctx.fillRect(x,y, gridItemWidth, gridItemWidth);
                        ctx.strokeRect(x, y, gridItemWidth, gridItemWidth);
                        ctx.stroke();
                    }
                }       
                
		    }

        function CreateNewGame(){

        function RoomCommands(room){
            $('#RoomCode').text("Room Code: " + room.roomId);
            sessionId = room.sessionId;

            //console.log(room);
            //console.log(room.state);

                    $("#HitText").removeClass("d-none");
                    $("#HitText").animate({color: "blue"}, 4000, function() {$("#HitText").addClass("d-none");});
                }
                else if (msg.hit=="miss"){
                    $('#HitModal').modal('show');
                }
                else {
                    alert("Strike on " + msg.id + " was a " + msg.hit);
                }
            })

            room.onDrop((code, reason) => {
                    console.log(`Connection dropped! Code: ${code}, Reason: ${reason}`);
                    //showReconnectingOverlay();
            });

            room.onReconnect(() => {
                console.log("Reconnected successfully!");
                if (room.state.turn == sessionId) {
                    $('#WaitingMessage').html('<p>Your Turn. Select a tile</p>')
                }
                else {
                    $('#WaitingMessage').html('<p>Opponents Turn. Please wait.</p>')
                }
            });

            room.onStateChange((state) => {
                stateData = state;
                console.log(state);

                if(state.players.size < 2){
                    //Wait for other player
                    $('#WaitingMessage').html('<p>Waiting for other player...</p>');
                }
                else {
                    if (AllPlayersReady(state.players)){                   
                        //Setup board and start game
                        console.log('Start Game!');
                        stateData = state;
                        UpdatePreviewBoard();
                        UpdatePlayingBoard();    
                        if (room.state.turn == sessionId) {
                            $('#WaitingMessage').html('<p>Your Turn. Select a tile</p>')
                        }
                        else {
                            $('#WaitingMessage').html('<p>Opponents Turn. Please wait.</p>')
                        } 
                    }
                    else{
                        console.log('else', state.players.get(room.sessionId));
                        if (state.players.get(room.sessionId).ready == "false"){
                           
                        //Prompt setup modal
                        SetupBoard();
                        $('#NewGameSetupModal').modal('show');
                        }
                        $('#WaitingMessage').html('<p>Other player setting up ships...</p>');
                    }
                }
                });

            $('#ReadyUpBtn').on('click', function(){
                console.log(ships);
                room.send("ready-up", {"ready": "true", "ships":ships});
            })
        
            $('#Gameboard').on('click', function(e){
                let x = e.offsetX; 
                let y = e.offsetY;
                let row = Math.floor(y / gridItemWidth);
                let column = Math.floor(x / gridItemWidth);
                let tileId = ((row * stateData.width) + column) + 1;
                room.send("strike", {opponentId: opponentId, tileId: tileId});
                console.log('send strike: ' + tileId);
            })
        }

        function UpdateRules(e){
            switch(e.srcElement.value){
                case "1":
                    $('#GameRuleControl').prop("disabled", true);
                break;
                case "2":
                    $('#GameRuleControl').removeAttr("disabled");
                    $('#ShipRuleControl').removeAttr("disabled");
                break;
            }
        }

        function SetRules(template){
            switch (template){
                case 1: //default
                    gameRules = {
                        "Ships":{
                            "Tiny":{"allowed": true,
                                    "count":1,
                                    "drinkAmount": 6},
                            "Small":{"allowed": true,
                                    "count":1,
                                    "drinkAmount": 3},
                            "Medium":{"allowed": true,
                                    "count":1,
                                    "drinkAmount": 2},
                            "Large":{"allowed": true,
                                    "count":1,
                                    "drinkAmount": 1},
                        },
                        "allowRotation": true,
                        "drinkWhenHit": true,
                        "drinkWhenSunk": false
                    }
                break;
                case 2:
                    gameRules = {
                        "Ships":{
                            "Tiny":{"allowed": true,
                                    "count":3,
                                    "drinkAmount": 6},
                            "Small":{"allowed": true,
                                    "count":3,
                                    "drinkAmount": 3},
                            "Medium":{"allowed": false,
                                    "count":0,
                                    "drinkAmount": 2},
                            "Large":{"allowed": false,
                                    "count":0,
                                    "drinkAmount": 1},
                        },
                        "allowRotation": true,
                        "drinkWhenHit": false,
                        "drinkWhenSunk": true
                    }
                break;
            }

        }
        
        function AllPlayersReady(map) {
            return Array.from(map.values()).every(value => value.ready == "true");
        }
    
        function RandomizeBoard(){
            ships = [];
            for(let i = 0; i < stateData.requiredShips.size; i++){
                let id = Math.floor(Math.random() * (stateData.width * stateData.height)) + 1;
                let shipType = stateData.requiredShips.get(i.toString()).idText;
                let img = '';
                let placed = false;
                while (!placed){
                    if (CheckPlacement(id, shipType)){
                    switch(shipType){
                        case "LargeShip":
                            ships.push({id: id, idText: "LargeShip", x: 0, y: 1});
                            ships.push({id: (id + (stateData.width)), idText: "LargeShip", x: 0, y: 2});
                            ships.push({id: (id - (stateData.width)), idText: "LargeShip", x: 0, y: 0});
                            ships.push({id: (id + 1), idText: "LargeShip", x: 1, y: 1});
                            ships.push({id: ((id  + 1) + (stateData.width)), idText: "LargeShip", x: 1, y: 2});
                            ships.push({id: ((id  + 1) - (stateData.width)), idText: "LargeShip", x: 1, y: 0});
                            img = boardThemes[selectedTheme].LargeShip;
                            $('#Setup' + (id)).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            $('#Setup' + (id + (stateData.width))).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            $('#Setup' + (id - (stateData.width))).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');

                            $('#Setup' + (id +1)).html('<img class="float-start" src="' + img +  '" height="100%" width="100%">');
                            $('#Setup' + ((id  + 1) + (stateData.width))).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            $('#Setup' + ((id  + 1) - (stateData.width))).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            break;
                        case "MedShip":
                            ships.push({id: id, idText: "MedShip", x:0, y: 1});
                            ships.push({id: (id - stateData.width), idText: "MedShip", x: 0, y: 0});
                            ships.push({id: (id + stateData.width), idText: "MedShip", x: 0, y: 2});
                            img = boardThemes[selectedTheme].MedShip;

                            //$('#Setup' + id).load('images/Icons/Subimage/bottle2.svg');
                            //$('#Setup' + (id - stateData.width)).load('images/Icons/Subimage/bottle2-1.svg');
                            //$('#Setup' + (id + stateData.width)).load('images/Icons/Subimage/bottle2bottom.svg');
                            $('#Setup' + (id)).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            $('#Setup' + (id - stateData.width)).html('<img class="float-start" src="' + img +  '" height="100%" width="100%">');
                            $('#Setup' + (id + stateData.width)).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            break
                        case "SmallShip":
                            ships.push({id: id, idText: "SmallShip", x: 0, y: 0});
                            ships.push({id: (id + 1), idText: "SmallShip", x: 1, y: 0});
                            img = boardThemes[selectedTheme].SmallShip;
                            $('#Setup' + id).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            $('#Setup' + (id + 1)).html('<img class="float-start" src="' + img +'" height="100%" width="100%">');
                            break;
                        case "TinyShip":
                            ships.push({id: id, idText: "TinyShip", x: 0, y: 0});
                            img = boardThemes[selectedTheme].TinyShip;
                            $('#Setup' + id).html('<img class="float-start" src="' + img + '" height="100%" width="100%">');
                            //$('#Setup' + id).load('images/Icons/Subimage/bottle2.svg');
                            //$('#Setup' + id).html('<img class="float-start" src="images/Icons/Subimage/bottle2.svg" height="100%" width="100%">');
                            break;
                    };
                    placed = true;
                } else {
                    id = Math.floor(Math.random() * (stateData.width * stateData.height)) + 1;
                    placed = false;
                }
                }
            }

            function CheckPlacement(id, shipType){
                switch(shipType){
                    case "LargeShip":
                        if (
                            id > stateData.width //not first row
                         && id < (stateData.width * stateData.height) - stateData.width //not last row
                         && id % stateData.width != 0 //not last column
                         && !ships.some(ship => ship.id == id)
                        ){
                            return true;
                        }
                        else{
                            return false;
                        }
                        break;
                    case "MedShip":
                        if (
                            id > stateData.width //not first row
                         && id < (stateData.width * stateData.height) - stateData.width //not last row
                         //&& id % stateData.width != 0 //not last column
                         && !ships.some(ship => ship.id == id)
                         && !ships.some(ship => ship.id == (id - stateData.width))
                         && !ships.some(ship => ship.id == (id + stateData.width))
                        ){
                            return true;
                        }
                        else{
                            return false;
                        }
                        break;
                    case "SmallShip":
                        if (
                            //id > stateData.width //not first row
                         //&& id < (stateData.width * stateData.height) - stateData.width //not last row
                         id % stateData.width != 0 //not last column
                         && !ships.some(ship => ship.id == id)
                         && !ships.some(ship => ship.id == (id + 1))
                        ){
                            return true;
                        }
                        else{
                            return false;
                        }
                        break;
                    case "TinyShip":
                        if (
                            //id > stateData.width //not first row
                         //&& id < (stateData.width * stateData.height) - stateData.width //not last row
                         //&& id % stateData.width != 0 //not last column
                         !ships.some(ship => ship.id == id)
                        ){
                            return true;
                        }
                        else{
                            return false;
                        }
                        break;
                };
            }
        }
    
        function SetImageSrc(){
            console.log(boardThemes[selectedTheme]);
            $('#imgTinyShip').attr('src',boardThemes[selectedTheme].TinyShip);
            $('#imgSmallShip').attr('src',boardThemes[selectedTheme].SmallShip);
            $('#imgMedShip').attr('src',boardThemes[selectedTheme].MedShip);
            $('#imgLargeShip').attr('src',boardThemes[selectedTheme].LargeShip);
        }
    </script>
</body>
