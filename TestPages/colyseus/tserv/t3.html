<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Colyseus Client Example</title>
  <!-- Load Colyseus JavaScript SDK from CDN -->
  <script src="https://unpkg.com/colyseus.js@0.16.22/dist/colyseus.js"></script>
</head>
<body>
  <h1>Colyseus Client Connection</h1>
  <label for="name">Name:</label>
  <input id="name" type="text"></input>
  <br>
  <textarea id="msg"></textarea>
  <br>
  <button onclick="SendMessage">Send</button>
  <div id="log"></div>
  <script>
    var room;

    (async () => {
      try {
        // Replace with your Colyseus server URL
        const SERVER_URL = "ws://76.13.102.11:2567";
        //const SERVER_URL = "ws://192.168.1.48:2567";

        // Create a Colyseus client
        const client = new Colyseus.Client(SERVER_URL);

        // Join or create a room
        room = await client.joinOrCreate("my_room", { username: "Player1" });

        console.log("Connected to room:", room.name, "with sessionId:", room.sessionId);

        // Listen for state changes
        room.onStateChange((state) => {
          console.log("Room state updated:", state);
        });

        // Listen for messages from the server
        room.onMessage("welcomeMessage", (message) => {
          console.log("Chat message received:", message);
        });

        room.onMessage("data", (message) => {
          console.log("Data received:", message);
        });

        // Example: send a message to the server
        room.send("data", { text: "Hello from client!" });

      } catch (err) {
        console.error("Connection error:", err);
      }
    })();

    function SendMessage(){
      room.send("data", {msg: document.getElementById('msg').value});
    }

  </script>
</body>
</html>
